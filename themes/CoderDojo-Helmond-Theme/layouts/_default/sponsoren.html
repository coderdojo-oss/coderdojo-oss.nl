{{ define "main" }}
 <section class="container mx-auto mx-auto px-5 py-10">
  <section class="h-10">
  
  </section>
  <article class="my-10">
      <h2 class="text-4xl font-bold">Sponsoren</h2>
      <p class="text-lg">{{ .Params.subtitle }}</p>
      {{ with .Content }}<div class="prose prose-lg max-w-3xl mt-6">{{ . }}</div>{{ end }}
  </article>
 <main class="grid grid-cols-1 space-y-10">
  {{ range .Site.RegularPages.ByWeight }}
  {{ if eq .Section "sponsoren" }}
  <figure class="flex flex-col bg-white border border-gray-200 rounded-lg shadow md:flex-row md:items-center">
    {{ with .Params.image }}
    <img class="object-contain w-full rounded-t-lg h-48 p-4 md:w-48 md:rounded-none md:rounded-s-lg"
        src="{{ . }}" alt="">
    {{ end }}
    <figcaption class="flex flex-col p-4 leading-normal">
        <h5 class="mb-2 text-2xl font-bold tracking-tight">{{ $name := .Params.name }}{{ with .Params.link }}<a href="{{ . }}">{{ $name }}</a>{{ else }}{{ $name }}{{ end }}</h5>
        <p class="mb-3 font-normal">{{ .Params.description }}</p>
    </figcaption>
  </figure>
  {{ end }}
{{ end }}
      
 </main>

 {{ partial "aanmeldbanner.html" . }}


</section>
{{ end }}
